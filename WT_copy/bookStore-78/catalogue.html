<!DOCTYPE html>
<html>

<head>
    <title>Book Catalogue</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>

<body>

    <header>
        <h1>Book Catalogue</h1>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="catalogue.html">Catalogue</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
    </nav>

    <div class="container">

        <table>
            <tr>
                <th>Book</th>
                <th>Author</th>
                <th>Price</th>
                <th>Action</th>
            </tr>

            <tr>
                <td>HTML & CSS</td>
                <td>Jon Duckett</td>
                <td>₹450</td>
                <td><button onclick="addToCart('HTML & CSS', 450)">Add to Cart</button></td>
            </tr>

            <tr>
                <td>Java Programming</td>
                <td>James Gosling</td>
                <td>₹500</td>
                <td><button onclick="addToCart('Java Programming', 500)">Add to Cart</button></td>
            </tr>

            <tr>
                <td>Python Basics</td>
                <td>Guido van Rossum</td>
                <td>₹400</td>
                <td><button onclick="addToCart('Python Basics', 400)">Add to Cart</button></td>
            </tr>

            <tr>
                <td>Database Systems</td>
                <td>Elmasri</td>
                <td>₹550</td>
                <td><button onclick="addToCart('Database Systems', 550)">Add to Cart</button></td>
            </tr>

            <tr>
                <td colspan="3" style="text-align:center;">
                    <button onclick="placeOrder()">Place Order</button>
                </td>
            </tr>

        </table>

    </div>

    <footer>
        <p>© 2026 Online Book Store</p>
    </footer>

</body>

</html>
