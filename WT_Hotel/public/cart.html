<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cart - Flavor Fusion</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
*{
    font-family: Arial, Helvetica, sans-serif;
    margin:0;
    padding:0;
}

body{
    background:#fff8f2;
}

/* Navbar */
.navbar-custom{
    background:#ec6c10;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:#fff;
}

.home-btn{
    text-decoration:none;
    background:#fff;
    color:#ec6c10;
    padding:8px 15px;
    border-radius:20px;
    font-weight:bold;
}

/* Title */
h2{
    text-align:center;
    margin-top:20px;
    color:#ec6c10;
}

/* Boxes */
.cart-box, .total-box, .feedback-box{
    background:#fff;
    padding:20px;
    border-radius:15px;
    box-shadow:9px 9px 12px #f1a975;
    margin-bottom:20px;
}

/* Table */
.table thead{
    background:#ec6c10;
    color:#fff;
}

.table tbody tr:hover{
    background:#fff2e6;
}

/* Image */
.food-img{
    width:60px;
    height:60px;
    border-radius:50%;
    object-fit:cover;
    margin-right:10px;
}

.item-box{
    display:flex;
    align-items:center;
}

/* Inputs */
.form-control, select{
    border-radius:10px;
    border:1px solid #ec6c10;
}

/* Buttons */
.btn-remove{
    background:red;
    color:#fff;
    border:none;
    border-radius:20px;
}

.btn-success{
    background:#ec6c10;
    border:none;
    border-radius:25px;
    color:#fff;
}

/* Feedback Stars */
.stars{
    display:flex;
    gap:10px;
    font-size:25px;
    cursor:pointer;
    color:#ccc;
}

.stars span.active{
    color:gold;
}

/* Empty */
.empty{
    text-align:center;
    color:#ec6c10;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar-custom">
    <h3>🍽️ Flavor Fusion</h3>
    <a href="index.html" class="home-btn">🏠 Home</a>
</div>

<div class="container mt-4">
    <h2>🛒 Your Cart</h2>

    <div class="row">
        <!-- CART -->
        <div class="col-md-8">
            <div class="cart-box">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Item</th>
                            <th>Price</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="cartItems"></tbody>
                </table>
            </div>

            <!-- FEEDBACK -->
            <div class="feedback-box">
                <h4 style="color:#ec6c10;">⭐ Give Feedback</h4>

                <div class="stars" id="stars">
                    <span onclick="rate(1)">★</span>
                    <span onclick="rate(2)">★</span>
                    <span onclick="rate(3)">★</span>
                    <span onclick="rate(4)">★</span>
                    <span onclick="rate(5)">★</span>
                </div>

                <textarea id="feedbackText" class="form-control mt-3" placeholder="Write your feedback..."></textarea>

                <button class="btn btn-success mt-3" onclick="submitFeedback()">Submit Feedback</button>
            </div>
        </div>

        <!-- BILL -->
        <div class="col-md-4">
            <div class="total-box">
                <h4>Total: ₹ <span id="total">0</span></h4>
                <hr>

                <h5 style="color:#ec6c10;">Billing Details</h5>
                <input type="text" id="name" class="form-control mb-2" placeholder="Full Name">
                <input type="text" id="address" class="form-control mb-2" placeholder="Address">
                
                <select id="payment" class="form-control mb-3">
                    <option>Cash on Delivery</option>
                    <option>UPI</option>
                    <option>Card</option>
                </select>

                <button class="btn btn-success w-100" onclick="checkout()">Place Order</button>
            </div>
        </div>
    </div>
</div>

<script>
// CART
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function displayCart(){
    let html = "";
    let total = 0;

    if(cart.length === 0){
        html = `<tr><td colspan="3" class="empty">🛒 Cart is empty</td></tr>`;
    }

    cart.forEach((item,i)=>{
        total += item.price;
        let img = item.image ? item.image : "https://via.placeholder.com/60";

        html += `
        <tr>
            <td>
                <div class="item-box">
                    <img src="${img}" class="food-img">
                    ${item.name}
                </div>
            </td>
            <td>₹ ${item.price}</td>
            <td><button class="btn btn-remove" onclick="removeItem(${i})">Remove</button></td>
        </tr>`;
    });

    document.getElementById("cartItems").innerHTML = html;
    document.getElementById("total").innerText = total;
}

function removeItem(i){
    cart.splice(i,1);
    localStorage.setItem("cart", JSON.stringify(cart));
    displayCart();
}

// CHECKOUT
function checkout(){
    let name = document.getElementById("name").value;
    let address = document.getElementById("address").value;

    if(name=="" || address==""){
        alert("Fill all details!");
        return;
    }

    alert("🎉 Order Placed!");
    localStorage.removeItem("cart");
    location.reload();
}

// FEEDBACK
let rating = 0;

function rate(star){
    rating = star;
    let stars = document.querySelectorAll("#stars span");
    stars.forEach((s,i)=>{
        s.classList.toggle("active", i < star);
    });
}

function submitFeedback(){
    let text = document.getElementById("feedbackText").value;

    if(rating === 0 || text === ""){
        alert("Give rating & feedback!");
        return;
    }

    let feedback = {
        rating: rating,
        message: text
    };

    localStorage.setItem("feedback", JSON.stringify(feedback));

    alert("✅ Feedback submitted!");
    document.getElementById("feedbackText").value = "";
}

displayCart();
</script>

</body>
</html>
