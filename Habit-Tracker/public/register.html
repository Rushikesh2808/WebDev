<!DOCTYPE html>
<html lang="en">

<head>
    <title>Register</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/register.css">
</head>

<body>

    <div class="container d-flex justify-content-center align-items-center vh-100">

        <div class="register-box">

            <h3 class="text-center mb-2">Create Account</h3>
            <p class="text-center text-muted mb-4">Start your productivity journey 🚀</p>

            <input type="email" id="email" class="form-control mb-3" placeholder="Email">

            <input type="password" id="password" class="form-control mb-3" placeholder="Password">

            <input type="password" id="confirmPassword" class="form-control mb-3" placeholder="Re-enter Password">

            <button class="btn btn-primary w-100 mb-3" onclick="register()">Register</button>

            <p class="text-center">
                Already have an account? <a href="index.html">Login</a>
            </p>

        </div>

    </div>

    <script src="js/register.js"></script>
</body>

</html>
