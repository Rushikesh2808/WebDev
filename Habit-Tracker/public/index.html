<!DOCTYPE html>
<html lang="en">

<head>
    <title>Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/login.css">
</head>

<body class="login-body">

    <div class="container d-flex justify-content-center align-items-center vh-100">

        <div class="login-box shadow">
            <h3 class="text-center mb-2">HabitFlow</h3>
            <p class="text-center text-muted mb-4">Build better habits daily</p>

            <input type="email" id="email" class="form-control mb-3" placeholder="Email">
            <input type="password" id="password" class="form-control mb-3" placeholder="Password">

            <button class="btn btn-dark w-100 mb-3" onclick="loginUser()">Login</button>

            <p class="text-center">
                Don’t have account? <a href="register.html">Register</a>
            </p>
        </div>

    </div>

    <script src="js/login.js"></script>
</body>

</html>
